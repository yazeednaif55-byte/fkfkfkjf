<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LiquidOS Media</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e3c72, #2a5298, #0f172a, #000000);
      background-size: 200% 200%;
      animation: bgShift 12s ease infinite;
      color: #fff;
      padding: env(safe-area-inset-top, 20px) 16px 40px;
    }
    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .header {
      text-align: center;
      margin: 15px 0 22px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 26px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.5); }
    button {
      background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1));
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      font-weight: 600;
      padding: 0 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:active { transform: scale(0.95); }
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .gif-item {
      width: 100%;
      height: 130px;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>LiquidOS Media</h1>
  </div>

  <!-- قسم تشغيل يوتيوب -->
  <div class="glass-card">
    <div class="section-title">مشغل YouTube</div>
    <div class="input-group">
      <input type="text" id="ytUrl" placeholder="الصق رابط فيديو يوتيوب هنا...">
      <button onclick="loadVideo()">تشغيل</button>
    </div>
    <div class="video-wrapper">
      <iframe id="ytFrame" src="https://www.youtube.com/embed/jfKfPfyJRdk?playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <!-- قسم معرض GIF -->
  <div class="glass-card">
    <div class="section-title">معرض GIF المتحركة</div>
    <div class="input-group">
      <input type="text" id="gifUrl" placeholder="الصق رابط صورة GIF لإضافتها...">
      <button onclick="addGif()">إضافة</button>
    </div>
    <div class="gif-grid" id="gifGrid">
      <img class="gif-item" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG56ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0HlBO7eyXzSZkJri/giphy.gif" alt="GIF 1">
      <img class="gif-item" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXp6ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eXh6ZzR4eSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7aD2saalBwwftBIY/giphy.gif" alt="GIF 2">
    </div>
  </div>

  <script>
    function loadVideo() {
      const url = document.getElementById('ytUrl').value.trim();
      if (!url) return;
      let videoId = '';
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = url.match(regExp);
      if (match && match[1]) {
        videoId = match[1];
        document.getElementById('ytFrame').src = `https://www.youtube.com/embed/${videoId}?playsinline=1&autoplay=1`;
      } else {
        alert('تأكد من لصق رابط يوتيوب صحيح');
      }
    }

    function addGif() {
      const url = document.getElementById('gifUrl').value.trim();
      if (!url) return;
      const img = document.createElement('img');
      img.src = url;
      img.className = 'gif-item';
      document.getElementById('gifGrid').prepend(img);
      document.getElementById('gifUrl').value = '';
    }
  </script>

</body>
</html>
