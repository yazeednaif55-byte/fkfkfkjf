name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare project files
        run: |
          cp .github/workflows/package.json ./package.json
          cp .github/workflows/capacitor.config.json ./capacitor.config.json
          mkdir -p www
          cp -r LiquidOS/www/* ./www/

      - name: Install dependencies and add iOS
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r $PWD/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r LiquidOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidOS-Unsigned-IPA
          path: ios/App/LiquidOS.ipa
